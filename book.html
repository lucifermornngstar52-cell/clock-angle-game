<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

 font-family:'Georgia','Times New Roman',serif;color:#2b2318;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}

 box-shadow:inset 0 0 60px rgba(120,90,40,.14);overflow-y:auto;overflow-x:hidden;padding:32px 30px 42px;font-size:14.5px;line-height:1.55;scrollbar-width:none}

#pgr{right:0;border-radius:4px 10px 10px 4px}

#pgl::before{content:'';position:absolute;top:0;bottom:0;left:0;width:26px;background:linear-gradient(90deg,rgba(90,60,20,.18),transparent);pointer-events:none;z-index:2}
#pgr::before{content:'';position:absolute;top:0;bottom:0;right:0;width:26px;background:linear-gradient(-90deg,rgba(90,60,20,.16),transparent);pointer-events:none;z-index:2}
#flip{position:absolute;top:0;right:0;width:50%;height:100%;transform-style:preserve-3d;transform-origin:left center;
 transition:transform .95s cubic-bezier(.55,.1,.3,1);z-index:30;pointer-events:none}

.fface::-webkit-scrollbar{display:none}
.ffront{border-radius:4px 10px 10px 4px;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
.fback{background:linear-gradient(-105deg,#efe6cc 0%,#f7f0dd 45%,#e7dcbc 100%);border-radius:10px 4px 4px 10px;transform:rotateY(180deg);box-shadow:8px 0 24px rgba(0,0,0,.35)}
#cover{position:absolute;inset:0;z-index:60;cursor:pointer;transform-origin:left center;transition:transform 1.15s cubic-bezier(.6,.05,.3,1),box-shadow 1.15s;
 border-radius:10px;background:#05040a url('book_assets/cover-front.jpg') center/cover no-repeat;
 display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;padding:0;text-align:center;
 box-shadow:0 30px 80px rgba(0,0,0,.75), inset 0 0 0 2px rgba(167,139,250,.25), inset 0 0 60px rgba(124,58,237,.25)}
#cover:hover{box-shadow:0 30px 90px rgba(0,0,0,.8), inset 0 0 0 2px rgba(167,139,250,.5), inset 0 0 60px rgba(124,58,237,.4)}
#cover.open{transform:rotateY(-170deg)}
#cover .cv-tip{margin-bottom:18px;color:#eaffb0;background:rgba(6,10,4,.55);border:1px solid rgba(163,230,53,.5);border-radius:999px;padding:7px 18px;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;animation:pulse 1.8s infinite;box-shadow:0 0 18px rgba(132,204,22,.35)}
@keyframes pulse{50%{opacity:.35}}

}

<script>
const PAGES = ["\n<div class=\"tp\">\n <div class=\"tp-min\">Министерство образования и науки Республики Казахстан<br>Северо-Казахстанская область · Мамлютский район<br>КГУ «Новомихайловская средняя школа»</div>\n <div class=\"tp-orn\">⧗ ⚡ ⧗</div>\n <h1 class=\"tp-title\">МАТЕМАТИКА<br>ВРЕМЕНИ</h1>\n <div class=\"tp-sub\">секция: прикладная математика</div>\n <div class=\"tp-line\"></div>\n <div class=\"tp-auth\"><b>Пеньков Никита</b>, 11 класс<br><b>Звягинцев Максим</b>, 10 класс</div>\n <div class=\"tp-meta\">Петропавловск · 2026</div>\n</div>", "<div class=\"ch1\"><h3 class=\"h\">Аннотация</h3><div class=\"body\">Данная работа представляет собой интерактивный образовательный комплекс, объединяющий игровые цифровые технологии и практико-ориентированную математику, направленный на популяризацию математических знаний, развитие логического мышления и эффективную подготовку учащихся к единому национальному тестированию (ЕНТ). В основу проекта положена идея объединения игровых цифровых технологий и традиционной практики решения задач вокруг одной из ключевых и прикладных тем математики — концепции времени. В работе представлен подход к решению математических задач, основанный на использовании аксиом циферблата, а также на системном развитии логики.</div></div>", "<div class=\"ch1\"><h3 class=\"h\">Abstract</h3><div class=\"body en\">This work is an interactive educational complex that combines gaming digital technologies and practice-oriented mathematics, aimed at popularizing mathematical knowledge, developing logical thinking, and effectively preparing students for the Unified National Testing (UNT). The project is based on the idea of combining gaming digital technologies and traditional problem solving practices around one of the key and applied topics in mathematics — the concept of time. The work presents an approach to solving mathematical problems based on the use of dial clock axioms, as well as on the systematic development of logic.</div></div>", "<div class=\"toc\"><h3 class=\"toc-h\">Содержание</h3><div class=\"toc-l\"><span class=\"toc-n\">Аннотация</span><span class=\"dots\"></span><span class=\"toc-p\">3</span></div><div class=\"toc-l\"><span class=\"toc-n\">Введение</span><span class=\"dots\"></span><span class=\"toc-p\">5</span></div><div class=\"toc-l\"><span class=\"toc-n\">Глава 1. Математический портрет часов</span><span class=\"dots\"></span><span class=\"toc-p\">10</span></div><div class=\"toc-l lvl2\"><span class=\"toc-n\">1.2 Применение аксиом при решении задач</span><span class=\"dots\"></span><span class=\"toc-p\">14</span></div><div class=\"toc-l lvl2\"><span class=\"toc-n\">Задача 3. «Справедливый разрез»</span><span class=\"dots\"></span><span class=\"toc-p\">18</span></div><div class=\"toc-l lvl2\"><span class=\"toc-n\">Задача 6. «Часы в других мирах»</span><span class=\"dots\"></span><span class=\"toc-p\">23</span></div><div class=\"toc-l\"><span class=\"toc-n\">Глава 2. Сборник задач «Математика времени»</span><span class=\"dots\"></span><span class=\"toc-p\">26</span></div><div class=\"toc-l\"><span class=\"toc-n\">Глава 3. Игры «Хранители времени: Квантовый сдвиг»</span><span class=\"dots\"></span><span class=\"toc-p\">29</span></div><div class=\"toc-l\"><span class=\"toc-n\">Заключение</span><span class=\"dots\"></span><span class=\"toc-p\">34</span></div><div class=\"toc-l\"><span class=\"toc-n\">Использованная литература</span><span class=\"dots\"></span><span class=\"toc-p\">36</span></div><div class=\"toc-note\">Листай краями книги, стрелками ← → или свайпом.</div></div>", "<div class=\"ch1\"><h3 class=\"h\">Введение</h3><div class=\"body\">В современном мире люди всё чаще пользуются цифровыми часами, где время отображается в виде готовых чисел. Из-за этого они теряют навык пространственного мышления, который тренирует классический круглый циферблат.</div></div>", "<div class=\"ch1\"><div class=\"body\">Математика часов – это не просто вычисление времени, а пересечение геометрии (углы, окружности), арифметики (дроби, проценты) и логики. В данной работе мы покажем, что циферблат – это поле деятельности математических заданий.</div><div class=\"goal\"><b>Цель проекта.</b> Создать интерактивный образовательный комплекс «Математика времени», объединяющий онлайн-игру «Хранители времени: Квантовый сдвиг» и разноуровневый сборник задач для учащихся разных возрастов, направленный на развитие математической грамотности, углубленное освоение темы и качественную подготовку к сдаче ЕНТ.</div></div>", "<div class=\"ch1\"><div class=\"goal\"><b>Гипотеза проекта.</b> Сборник разновозрастных и разноуровневых задач и сборник онлайн-игры, которые тесно пересекаются, но не дублируют друг друга, станут отличным тренажёром для развития гибкости ума и умения находить выходы для решения самых сложных задач.</div><div class=\"goal\"><b>Задачи проекта:</b><div class=\"ls\"><div class=\"li\">— Изучить теоретические основы: рассчитать угловые скорости движения часовой и минутной стрелок в градусах.</div><div class=\"li\">— Проанализировать классические задачи: разобрать алгоритмы решения задач на нахождение углов, совпадение стрелок и симметрию циферблата.</div><div class=\"li\">— Разработать сборник разновозрастных, разноуровневых заданий.</div><div class=\"li\">— Разработать авторскую коллекцию разновозрастных, разноуровневых онлайн-игр.</div></div></div></div>", "<div class=\"ch1\"><div class=\"goal\"><b>Актуальность.</b> Данные интернет-игры не просто дублируют задачи, а тематически пересекаются с печатным сборником, образуя единую цифровую экосистему. Игра выступает тренажером для закрепления практических навыков, а решённый задачник — теоретическим и логическим фундаментом.</div><div class=\"goal\"><b>Новизна проекта.</b> 1) Геймификацию интерфейса: замена привычной 12-часовой цифровой шкалы динамичными математическими задачами разного уровня сложности.</div></div>", "<div class=\"ch1\"><div class=\"body\">2) Исследование динамических аксиом и парадоксов: разбор ситуаций, в которых визуальное восприятие времени противоречит математическим расчетам (например, «ловушка» угла в 15:30).</div><div class=\"goal\"><b>Методы исследования.</b><div class=\"ls\"><div class=\"li\">— Теоретический анализ: изучение литературы и интернет-ресурсов, посвященных истории часов и математическим задачам на движение по окружности.</div><div class=\"li\">— Математическое моделирование: описание движения стрелок с помощью формул и угловых скоростей.</div><div class=\"li\">— Графический метод: построение схем циферблата для визуализации углов в разные промежутки времени.</div><div class=\"li\">— Конструирование: создание игровой модели учебного процесса. Перевод математических условий в игровой контекст.</div></div></div><div class=\"body\">Материал проекта станет увлекательным интеллектуальным маршрутом для каждого, кто стремиться к новым открытиям.</div></div>", "<div class=\"chap\"><div class=\"chap-num\">Глава 1</div><div class=\"chap-ic\">🕰</div>\n<h2 class=\"chap-name\">Математический портрет часов<br>и динамика движения стрелок</h2>\n<div class=\"chap-line\"></div><div class=\"chap-meta\">1.1 Описание математического циферблата. Аксиомы циферблата<br>1.2 Применение аксиом при решении математических задач</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">1.1 Описание математического циферблата. Аксиомы циферблата</h4><div class=\"body\">Обычные часы скрывают в себе сложную геометрию, теорию чисел и их алгоритмы. Слово «циферблат» пришло из немецкого языка (Zifferblatt - «лист с цифрами»). Время — это расстояние между двумя точками, измеренное логикой. Часы с обратным ходом отлично тренирует пространственное мышление. Например, представить себе циферблат, где цифры идут против часовой стрелки. Вопрос: «Если такие часы показывают 2 часа назад от точки 12, сколько времени на обычных часах?»</div><div class=\"axioms\"><b>Аксиомы циферблата:</b><div class=\"ls\"><div class=\"li\">1) Весь круг составляет 360°.</div><div class=\"li\">2) Сумма всех чисел на часах равна 78. 78 делится без остатка на 1, 2, 3, 6, 13.</div><div class=\"li\">3) Каждую минуту минутная стрелка поворачивается на 6 градусов — это в точности один «зубчик» на большинстве шестеренок.</div></div></div></div>", "<div class=\"ch1\"><div class=\"goal\"><b>Скорость минутной стрелки.</b> 360°:60 минут => за 1 минуту минутная стрелка проходит 6°, то есть скорость равна 6° в минуту. За 1 секунду</div><div class=\"goal\"><b>Скорость часовой стрелки.</b> 360°:12 часов => за 1 час часовая стрелка проходит 360:12=30°, за 1 час часовая стрелка проходит 30°, => за 1 минуту часовая стрелка проходит 0,5°. То есть скорость часовой стрелки равна 0,5° в минуту. Скорость часовой стрелки за 1 секунду</div><div class=\"body\">Аналогично скорость секундной стрелки 6° в секунду.</div><div class=\"sh\"><b>⚡ «Скоростная» шпаргалка</b><div class=\"ls\"><div class=\"li\">30° — угол между двумя соседними цифрами на часах.</div><div class=\"li\">6° — угол, на который поворачивается минутная стрелка за 1 минуту.</div><div class=\"li\">0,5° — угол, на который поворачивается часовая стрелка за 1 минуту.</div><div class=\"li\">— скорость, с которой стрелки догоняют друг друга (скорость сближения).</div></div></div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Тайна марсианского времени</h4><div class=\"body\">Рассмотрим концепцию часов для планет с другим циклом вращения. Например Марсианские часы. Год на Марсе длится примерно 668 марсианских солов. Марсианские сутки (их называют Сол) длятся примерно 24 часа 39 минут и 35 секунд (по земным меркам) то есть примерно 24 часа 40 минут. Чтобы марсианские часы совершали полный цикл за один Сол, все стрелки должны двигаться медленнее, чем на Земле.</div><div class=\"goal\"><b>Найдём коэффициент замедления — разницу в продолжительности суток:</b><div class=\"ls\"><div class=\"li\">1) Земные солнечные сутки (вращение земли во круг своей оси) равны 24 часа = 86400 секунд.</div><div class=\"li\">2) Марсианские солнечные сутки (Сол)  24 часа 39 минут 35 секунд = 88775 секунд.</div><div class=\"li\">3) Разница в секундах 88775 – 86400 = 2375 секунд.</div><div class=\"li\">4) Отношение разницы к земным суткам . То есть Марс добавляет сверху к земным суткам 0,0275 часть.</div><div class=\"li\">5) Переведём в проценты</div><div class=\"li\">Значит Марсианские сутки длиннее земных примерно на 2,75%.</div><div class=\"li\">6) Отношение марсианского времени к земному</div><div class=\"li\">7) Один марсианский сол – это  земных часа.</div></div></div></div>", "<div class=\"ch1\"><h4 class=\"h4\">1.2 Применение аксиом при решении математических задач</h4><div class=\"fact\"><b>🌍 Невероятный факт.</b> Почему мы не видим, как движется часовая стрелка? Её скорость — всего 0,008 градуса в секунду. Это в 10 раз медленнее, чем скорость, с которой ползет обычная садовая улитка! Математика объясняет, почему время кажется нам неподвижным, хотя оно постоянно «убегает».</div><div class=\"body\">Рассмотрим решении некоторых математических задач.</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Задача 1. Совпадение стрелок</h4><div class=\"body\">Это задачи, где угол между часовой и минутной стрелкой равен 0 градусов. Ключ к решению: минутная стрелка должна полностью ликвидировать «дистанцию», которая разделяла её с часовой в начале часа.</div><div class=\"task\"><b>«Классическая встреча».</b><div class=\"cond\">В какой момент времени между 4 и 5 часами дня стрелки часов совпадут?</div><div class=\"sol\"><b>Решение:</b> Начальное положение стрелок 16:00, минутная стрелка на 12 , а часовая на цифре 4 . Чтобы стрелки совпали, минутной стрелке нужно пройти на  больше, чем часовой.</div><div class=\"answ\">Ответ: стрелки совпадут в <b>4:21:49</b>.</div></div></div>", "<div class=\"ch1\"><div class=\"task\"><b>«Встреча неизбежна» (перепутанные стрелки).</b><div class=\"cond\">Сколько раз в сутки часовая и минутная стрелки совпадают?</div><div class=\"sol\"><b>Решение.</b> Первое совпадение после 00:00 произойдет, когда минутная стрелка обгонит часовую ровно на один круг 360°. То есть стрелки встречаются каждые 1 час 5 минут и примерно 27 секунд.</div><div class=\"body\">Пусть t — время в минутах. Уравнение совпадения: 6t - 0,5t = 360k, где k — целое число оборотов.</div><div class=\"body\">5,5t = 360k. За 12 часов (720 минут) стрелки встретятся k = = 11 раз. За сутки (24 часа) они встретятся  раза.</div><div class=\"answ\">За 12 часов — 11 встреч, за сутки — 22.</div></div><table class=\"dt \"><tr><th>Приближённое время</th><th>Точное время</th><th>Точное время (ч:мин:сек)</th></tr><tr><td>00:00</td><td></td><td>00:00:00</td></tr><tr><td>01:05</td><td></td><td>01:05:27</td></tr><tr><td>02:11</td><td></td><td>02:10:54</td></tr><tr><td>03:16</td><td></td><td>03:16:21</td></tr><tr><td>04:22</td><td></td><td>04:21:49</td></tr><tr><td>05:27</td><td></td><td>05:27:16</td></tr><tr><td>06:33</td><td></td><td>06:32:43</td></tr><tr><td>07:38</td><td></td><td>07:38:11</td></tr><tr><td>08:44</td><td></td><td>08:43:38</td></tr><tr><td>09:49</td><td></td><td>09:49:05</td></tr><tr><td>10:55</td><td></td><td>10:54:32</td></tr></table></div>", "<div class=\"ch1\"><div class=\"sh\"><b>📌 Резюме для запоминания</b><div class=\"ls\"><div class=\"li\">Если вам нужно найти время встречи в любой час, используйте универсальную схему:</div><div class=\"li\">Определите расстояние в градусах между стрелками в начале часа (каждый час — это 30</div><div class=\"li\">Разделите этот угол на 5,5.</div><div class=\"li\">Полученный результат — это количество минут после начала часа.</div></div></div><div class=\"body\">Универсальная формула совпадения стрелок . Где Н – это деление на циферблате (от 1 до 11).</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Задача 3. «Справедливый разрез»</h4><div class=\"task\"><div class=\"cond\">Можно ли провести две прямые линии через циферблат так, чтобы сумма чисел в каждой из получившихся трех частей была одинаковой?</div><div class=\"sol\"><b>Решение.</b> Сумма всех чисел на циферблате: 1 + 2 +….+ 12 = 78. Если мы делим на 3 части с равной суммой, в каждой части сумма должна быть 78: 3 = 26. Ищем комбинации соседних чисел это есть11 + 12 + 1 + 2 = 26 и 10 + 9 + 4 + 3 = 26,  5 + 6 + 7 + 8 = 26.</div><div class=\"answ\">Ответ: Да, можно. Прямые должны отсечь сектора (11, 12, 1, 2) и (10, 9, 3, 4).</div></div></div>", "<div class=\"ch1\"><div class=\"task\"><b>2) Задача.</b> 2) Разрезать циферблат на 6 частей так, чтобы в каждой части сумма чисел была одинаковой.</div><div class=\"sol\"><b>Решение.</b> Решение: Сумма всех чисел на циферблате: 1 + 2 +….+ 12 = 78. Сумма в каждой из 6 частей: 78 : 6 = 13.</div><div class=\"pairs\"><span class=\"pair\">(12, 1)</span><span class=\"pair\">(11, 2)</span><span class=\"pair\">(10, 3)</span><span class=\"pair\">(9, 4)</span><span class=\"pair\">(8, 5)</span><span class=\"pair\">(7, 6)</span></div><div class=\"body\"><b>Визуализация.</b> Визуализация: Это будут 3 прямые линии, проходящие через центр? Нет! Это должны быть параллельные разрезы.</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Задача 4. «Сломанный циферблат»</h4><div class=\"task\"><div class=\"cond\">На треснутом циферблате, линия разреза проходит между 9 и 10, и между 3 и 4. Будут ли равны суммы чисел  в обеих частях.</div><div class=\"sol\"><b>Решение.</b> Решение. Сумма всех чисел на циферблате равна 78, значит в каждой части сумма должна быть равна 78:2=39. Проверим части по условию: 1) от 10 до 3: 10+11+12+1+2+3=39. 2) от 4 до 9: 4+5+6+7+8+9=39. Вывод суммы равны.</div></div><h4 class=\"h4\">Задача 7. «Зеркальное отражение»</h4><div class=\"task\"><div class=\"cond\">Пусть стрелки показывают 3:45. Вопрос: какое время увидит человек в отражении? (Ответ: 8:15).</div><div class=\"ls\"><div class=\"li\">Пусть стрелки показывают 9:20. Вопрос: какое время увидит человек в отражении? (Ответ: 2:40).</div><div class=\"li\">Пусть стрелки показывают 10:15:40. Вопрос: какое время увидит человек в отражении? (Ответ: 1:44:20).</div></div><div class=\"sol\"><b>Решение.</b> Решение: Математический способ расчёта 11:60 – это и есть 12:00. Тогда 11:60 – 9:20 = 2:40.  Или 11:59:60 - 10:15:40 = 1:44:20.</div></div><table class=\"dt \"><tr><th>Реальное положение</th><th>Отражение в зеркале</th></tr><tr><td>1 час</td><td>11 часов</td></tr><tr><td>2 часа</td><td>10 часов</td></tr><tr><td>3 часа</td><td>9 часов</td></tr><tr><td>4 часа</td><td>8 часов</td></tr><tr><td>5 часов</td><td>7 часов</td></tr><tr><td>6 часов</td><td>6 часов</td></tr></table></div>", "<div class=\"ch1\"><h4 class=\"h4\">Задача 5. «Логические задачи» (зеркала)</h4><div class=\"task\"><div class=\"cond\">Вы зашли в комнату и увидели в зеркале отражение часов. Секундной стрелки на них нет, а минутная и часовая показывают ровно 7:10. <b>Вопрос: Какое время на самом деле на этих часах?</b></div><div class=\"sol\"><b>Решение.</b> Решение: если в зеркале мы видим 7:10, то: Минутная стрелка в зеркале на цифре 2. В реальности она была на цифре 10 (50 минут). Часовая стрелка в зеркале чуть дальше цифры 7. В реальности она находится чуть дальше цифры 4. Сложением проверить тоже легко: 4:50 + 7:10 = 12:00.</div><div class=\"answ\">Ответ: <b>4:50</b>.</div></div></div>", "<div class=\"ch1\"><div class=\"task\"><div class=\"cond\">Вы стоите в комнате, где два зеркала висят на противоположных стенах. Вы смотрите в зеркало перед собой и видите в нем отражение зеркала, которое висит сзади, а в нем — часы. <b>Вопрос: Если на реальных часах 9:20, какое время вы увидите в этом «двойном» отражении?</b></div><div class=\"sol\"><b>Решение.</b> Решение. При двойном отражении, срабатывает правило «минус на минус дает плюс». В первом зеркале время отражается (право и лево меняются местами), а второе зеркало отражает уже это отражение, возвращая всё в исходный вид.</div><div class=\"answ\">Ответ: В двойном отражении вы увидите те же самые 9:20.</div><div class=\"body\">Это именно тот случай, когда мы видим себя в парикмахерской через систему зеркал — там мы выглядим именно так, как нас видят окружающие, а не так, как мы привыкли видеть себя в обычном зеркале по утрам.</div><div class=\"fact\"><b>Вывод.</b> Заметим: Если бы зеркал было три, время снова стало бы «зеркальным» (2:40). Четное количество отражений возвращает реальность, нечетное — переворачивает её.</div></div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Задача 6. «Часы в других мирах»</h4><div class=\"task\"><div class=\"cond\">1) Инженеры NASA управляют марсоходом. Когда на Марсе проходит ровно 10 солов, на Земле проходит больше времени. Используя коэффициент длины соло относительно земных суток 1.0275, вычислите сколько полных часов и минут пройдёт на Зедле за это время.</div><div class=\"sol\"><b>Решение.</b> 1. Так как отношение марсианского времени к земному за 10 солов равно суток. 2. Переведём в земное время. . Это 6 часов  минут.</div><div class=\"answ\">Ответ: на Земле пройдёт <b>10 суток 6 часов 36 минут</b>.</div></div><div class=\"task\"><b>«День рождения Марса».</b> «День рождения Марса». Ребёнку на Земле исполнилось 12 лет ( в году 365 дней), то сколько ему лет по марсианскому календарю (в году 668 солов)?</div><div class=\"sol\">1 Количество дней в 12 земных годах:   дней. 2. Находим марсианские годы: 4380:668=6,55</div><div class=\"answ\">Ответ. 12-летнему землянину на Марсе было бы полных 6 лет.</div></div>", "<div class=\"ch1\"><div class=\"task\"><div class=\"cond\">На сколько минут марсианские часы убегут вперёд относительно земных за 4 земных суток?</div><div class=\"sol\"><b>Решение.</b> Так как разница марсианского времени от земного 39 минут и 35 секунд =  секунд за каждые сутки. Следовательно за 4 суток:   секунд. А это есть  минуты, 158:60=2,6 часа,  минут и  секунд.</div><div class=\"answ\">Ответ: <b>2 часа 36 минут 18 секунд</b>.</div></div><div class=\"task\"><div class=\"cond\">Марсианские сутки (Сол) = 24 часа 40 минут. Земные часы делают полный цикл (круг) за 24 часа. Вопрос 1: Какое время покажут земные часы через один Сол?</div><div class=\"sol\"><b>Решение.</b> Решение. Земные часы в полночь показывают 00:00. Через 24 часа они снова покажут 00:00 (завершат полный цикл). Но марсианские сутки длятся еще на 40 минут дольше. Следовательно, когда на Марсе закончится первый Сол, земные часы «убегут» вперед и будут показывать 00:40 следующего дня.</div><div class=\"answ\">Ответ: <b>00:40</b>.</div></div></div>", "<div class=\"ch1\"><div class=\"task\"><div class=\"cond\">Вопрос 2: Через сколько суток время на часах и на планет1е снова совпадет? И сколько полных земных суток пройдет за это время?</div><div class=\"sol\"><b>Решение.</b> Решение. Чтобы время снова совпало в полночь (показало 00:00 там и там), нужно найти такой момент, когда «лишние» 40 минут накопятся в целое количество земных суток (по 24 часа).</div><div class=\"ls\"><div class=\"li\">1. Переведем всё в минуты.</div><div class=\"li\">Земные сутки = 24часа = 1440 минут.</div><div class=\"li\">Марсианский «сдвиг» = 40 минут.</div><div class=\"li\">2. Нужно узнать, через сколько марсианских суток (x) сумма всех «лишних» сорокаминуток станет кратна 1440 минутам.</div><div class=\"li\">3. Составим уравнение.</div><div class=\"li\">Где x – количество марсианских суток, а k – количество полных земных кругов. Найдём минимальное х=1140 : 40=36. То есть через 36 марсианских суток лишнее время составит ровно 1440 минут, то есть ровно одни земные сутки.</div></div><div class=\"answ\"><b>Ответ.</b><div class=\"ls\"><div class=\"li\">1) Через 1 сол земные часы покажут 00:40.</div><div class=\"li\">2) Время снова совпадёт ( то есть покажет 00:00) через 36 марсианских суток.</div></div><div class=\"li\">А тогда, сколько полных земных суток пройдет за это время? Ответ. 37 суток, так как 36 марсианских суток  24 часа 40 минут =37 земных суток.</div></div></div></div>", "<div class=\"chap\"><div class=\"chap-num\">Глава 2</div><div class=\"chap-ic\">📚</div>\n<h2 class=\"chap-name\">Сборник задач<br>«Математика времени»</h2>\n<div class=\"chap-line\"></div><div class=\"chap-meta\">60 задач · с 1 по 11 класс · пошаговые разборы</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">Структура сборника</h4><div class=\"body\">Время — одна из самых сложных и абстрактных математических категорий (работа со стрелочными часами, углами, временными зонами, интервалами, циклами). Сборник задач с готовыми решениями помогает структурировать тему и показывает различие и взаимосвязь между математическими моделями и реальным отсчетом времени. А необычные условия, вроде перевода земных лет в годы на Марсе или Юпитере, удерживают интерес и значительно расширяют кругозор.</div><div class=\"body\">В сборнике представлены 60 задач. Задачи в сборнике разбиты по возрасту (с 1 по 11 класс) и плавно усложняются. Структура сборника и перечень предложенных разделов представлены в Таблице 1.</div><table class=\"dt \"><tr><th>Раздел</th><th>Класс</th><th>Количество задач</th></tr><tr><td>I.</td><td>1-4 класс. Арифметика времени.</td><td>10</td></tr><tr><td>II.</td><td>5-6 класс. Аксиомы циферблата и геометрия стрелок.</td><td>10</td></tr><tr><td>III.</td><td>7-8 класс. Алгебра движения и справедливое деление.</td><td>10</td></tr><tr><td>IV.</td><td>9-10 класс. Геометрия циферблата и время на других планетах.</td><td>10</td></tr><tr><td>V.</td><td>11 класс. Подготовка к ЕНТ (Математическая грамотность и логика)</td><td>20</td></tr></table></div>", "<div class=\"ch1\"><div class=\"body\">Учащиеся начального звена 1-4 класс тренируют арифметику на жизненных ситуациях: считают время в пути или длительность сна. Ученики среднего и старшего звена переходят к геометрии и алгебре: вычисляют углы между стрелками; решают задачи на отражение в зеркале; деление циферблата; планиметрия циферблата; на вычисление космического времени и других планет; числовые закономерности на электронных табло; календарные циклы, табло и планетарные алгоритмы; логика, теория вероятности, нестандартное мышление и другие. Всё это готовит их к блоку математической грамотности на ЕНТ.</div><div class=\"body\">Главная цель – показать, что математика нужна не только на контрольных, но и для решения жизненных проблем.</div><div class=\"goal\"><b>Представленные задачи развивают:</b><div class=\"ls\"><div class=\"li\">1) Прикладные навыки: ученики развивают навыки грамотно планировать свой день, рабочие смены и отдых.</div><div class=\"li\">2) Пространственное мышление: круговой циферблат служит отличным тренажёром для работы с градусами, площадями секторов и симметрией.</div><div class=\"li\">3) Гибкость ума: задания со спешащими будильниками и песочными часами разного объёма учат не теряться и искать выход за рамками шаблонов.</div></div></div><div class=\"body\">Наличие пошаговых разборов к каждой задаче трансформирует сборник из обычного задачника в полноценный самоучитель. Учащиеся получают возможность не просто сверить ответ, а восстановить алгоритм рассуждений, обнаружить и исправить ошибку.</div></div>", "<div class=\"chap\"><div class=\"chap-num\">Глава 3</div><div class=\"chap-ic\">🎮</div>\n<h2 class=\"chap-name\">Коллекция онлайн-игр<br>«Хранители времени:<br>Квантовый сдвиг»</h2>\n<div class=\"chap-line\"></div><div class=\"chap-meta\">Android · Windows · iOS · 13 достижений · турниры</div></div>", "<div class=\"ch1\"><div class=\"body\">Понятие времени непрерывно, а статичный текст на бумаге не всегда может передать движение стрелок, смену циклов или работу циферблата. Браузерные игры позволяют наглядно «пощупать» временные механизмы через динамические модели и симуляторы.</div><div class=\"body\">Задачи, перенесенные в игровой формат переключают восприятие учащихся с «обязательной учебы» на увлекательный игровой процесс, повышая эмоциональный отклик и глубже вовлекая в предмет. Технические характеристики представлены в Таблице 2.</div><div class=\"goal\"><b>Общие игровые системы:</b><div class=\"ls\"><div class=\"li\"><b>Достижения.</b> Система достижений обновляется при каждой победе и сохраняет прогресс пользователя в localStorage. Всего 13 достижений: 8 для Повелителя Времени и 5 для Властелинов Времени.</div><div class=\"li\"><b>Турниры.</b> Еженедельные турниры с выплатой внутриигровых монет: 1 место — 100 монет, 2 место — 50 монет, 3 место — 25 монет.</div><div class=\"li\"><b>Магазин.</b> Магазин подсказок за внутриигровые монеты (подсказка — 15 монет).</div><div class=\"li\"><b>Таблица лидеров.</b> Рейтинг игроков по общему количеству шестерёнок и побед.</div><div class=\"li\"><b>Синхронизация.</b> Прогресс и статистика синхронизируются через Supabase (онлайн-режим). Оффлайн-режим использует localStorage.</div></div></div><div class=\"body\">Меню по классам Игры разделены по классам: 0–11, 5–6, 6–7, 7–8, 8–9, 9–10, 10–11.</div></div>", "<div class=\"ch1\"><h4 class=\"h4\">3.1 Властелины Времени (1–5 класс)</h4><div class=\"body\">Властелины Времени — образовательная игра по математике для детей 1-5 класса. В данной игре 53 вопроса. Вопросы задаются в хаотичном порядке. Вопросы представлены в виде ячеек на разноцветной окружности. Цветовая гамма окружности разделена на уровни сложности вопросов, представлена в структуре игры в Таблице 2. Всего 49 ячеек. На 49 ячейке – финальный экзамен, состоящий из 5 вопросов. Время на выбор ответа не ограничено, но показано общее время при прохождении игры.</div><div class=\"goal\"><b>Цель игры:</b> первым дойти до 49й ячейки и пройти финальный экзамен. Выигрывает тот, кто наберёт больше жетонов, пройдёт финальный экзамен и ты – властелин времени!</div><table class=\"dt \"><tr><th>Цвет</th><th>Уровень сложности</th><th>Номер клетки (вопроса)</th><th>Количество жетонов за каждый правильный ответ</th></tr><tr><td>Зелёный</td><td>лёгкий</td><td>1-20</td><td>1</td></tr><tr><td>Жёлтый</td><td>средний</td><td>21-40</td><td>2</td></tr><tr><td>Красный</td><td>сложный</td><td>41-60</td><td>3</td></tr><tr><td>Фиолетовый</td><td>парадокс</td><td>10, 20, 30, 40</td><td>Бонус или штраф</td></tr><tr><td>Жёлтый</td><td>Финальный экзамен</td><td>49</td><td>3</td></tr></table></div>", "<div class=\"ch1\"><h4 class=\"h4\">3.2 Хранители времени</h4><div class=\"body\">Хранители времени – образовательная игра</div><div class=\"goal\"><b>Мини-игры:</b><div class=\"ls\"><div class=\"li\">1. Довези Автобус (5-6 кл) — перетащи стрелки на время прибытия автобуса.</div><div class=\"li\">2. Поймай Секунду (5-6 кл) — нажми кнопку после N оборотов стрелки</div><div class=\"li\">3. Мир Зеркал (5-6 кл) — найди зеркальное отражение часов</div><div class=\"li\">4. Угол Времени (6-7 кл) — выстави заданный угол между стрелками</div><div class=\"li\">5. Синхронизация (6-7 кл) — останови стрелки в момент совпадения</div><div class=\"li\">6. Раскол Времени (7-8 кл) — раздели циферблат на части с равными суммами</div><div class=\"li\">7. Архитектор Циферблата (7-8 кл) — раздели на 6 частей с суммой 13</div><div class=\"li\">8. Построй Треугольник (8-9 кл) — геометрия на циферблате (Фалес, равносторонние)</div><div class=\"li\">9. Марсианский Календарь (9-10 кл) — конвертация земного времени в марсианское</div><div class=\"li\">10. Спаси Навигатор (10-11 кл) — калибровка GPS по теории Эйнштейна</div></div></div></div>", "<div class=\"ch1\"><h4 class=\"h4\">3.3 Повелитель времени (5–11 класс)</h4><div class=\"task\"><div class=\"cond\">3. Повелитель времени – игра для 5-11 класса. Сюжет: Игрок — помощник учёного, обнаруживший в лаборатории загадочную машину времени с мерцающим циферблатом. Система заблокирована — чтобы получить доступ, нужно решить серию задач на определение углов между стрелками часов. Четыре уровня, четыре эпохи. История ждёт. Структура каждого уровня представлена в Таблице 3.</div><div class=\"goal\"><b>Цель:</b> Взломать все 4 уровня машины времени, правильно определяя углы между стрелками. После взлома игрок «перемещается» в случайную историческую эпоху.</div><div class=\"body\">Подробные правила и характеристики игры доступны в специальном разделе меню перед запуском игры.</div></div><div class=\"fact\">Главная ценность проекта заключается в синергии двух его компонентов: задачи из сборника развивают строгое логическое мышление, а цифровая игра повышает мотивацию и переводит абстрактные правила в наглядный опыт. Изучение категории времени через призму математики и аксиоматики позволяет школьникам по-новому взглянуть на стандартные понятия, превращая измерение времени из бытового навыка в инструмент глубокого аналитического познания.</div><table class=\"dt \"><tr><th>Параметр</th><th>Значение</th></tr><tr><td>Платформа</td><td>Android (APK, 3.3 МБ), Windows (EXE, 83.3 МБ), iOS (PWA, 89 КБ)</td></tr><tr><td>Версия</td><td>v24 (13 августа 2026)</td></tr><tr><td>Сборка</td><td>GitHub Actions — автоматическая сборка APK/EXE/PWA</td></tr><tr><td>База данных</td><td>Supabase (онлайн-статистика), localStorage (оффлайн)</td></tr><tr><td>Мультиплеер</td><td>PeerJS (P2P-соединение для дуэлей)</td></tr><tr><td>Визуальный стиль</td><td>Тёмно-серая палитра #1C1E2A, неоновые акценты, шрифт Orbitron</td></tr><tr><td>Музыка</td><td>Канон Пахельбеля (классическая), авто-стоп при сворачивании</td></tr></table></div>", "<div class=\"ch1\"><h3 class=\"h\">Заключение</h3><div class=\"body\"><i>«Математика часов учит нас внимательности. Она показывает, что даже в самых привычных вещах скрыты сложные законы.</i></div><div class=\"body\">Работая над проектом, мы пришли к выводу, что часы — это не просто прибор, а бесконечный источник математических закономерностей. Обычный циферблат помогает нам визуализировать дроби, углы и даже сложные логические задачи.</div></div>", "<div class=\"ch1\"><div class=\"body\">Коллекция цифровой разновозрастной, разноуровневой онлайн-игры «Хранители времени: Квантовый сдвиг.» создана для вызова интереса к предмету через геймификацию. Разноуровневая игра, в которой требуется применять математические расчеты, логику.</div><div class=\"body\">Разноуровневый сборник задач: Систематизированный фонд заданий, охватывающий широкий возрастной диапазон учащихся с 1 по 11 класс. Задачи распределены по степени сложности — от наглядных логических головоломок до текстовых и геометрических задач повышенной трудности.</div><div class=\"body\">Сборник разноуровневых и разновозрастных задач и сборник интеллектуальной интернет-игры взаимосвязаны. Задания гармонично перекликаются, но не дублируют друг друга, развивая логику, гибкость ума и навык поиска нетривиальных решений. Издание доступно для исследования каждому читателю, а наличие подробных решений и ответов к каждой задаче делает работу с материалом максимально комфортной и эффективной.</div><div class=\"final\">⧗<br>Математика — это язык, на котором говорят часы.</div></div>", "<div class=\"ch1\"><h3 class=\"h\">Использованная литература</h3><div class=\"lit\"><div class=\"li\">Абылкасымова, А. Е. Теория и методика обучения математике : учеб. пособие / А. Е. Абылкасымова. — Алматы : Мектеп, 2021. — 224 с.</div><div class=\"li\">Ахметов, Б. С. Цифровизация и геймификация в современном образовательном процессе : монография / Б. С. Ахметов, Г. К. Нургалиева. — Алматы : КазНПУ им. Абая, 2023. — 205 с.</div><div class=\"li\">Блинова, И. В. Математические задачи и головоломки в современной дидактике / И. В. Блинова, П. А. Попов. — СПб. : БХВ-Петербург, 2021. — 210 с.</div><div class=\"li\">Вербах, К. Вовлекай и побеждай. Игровое мышление на службе бизнеса и образования / К. Вербах, Д. Хантер. — М. : Эксмо, 2022. — 224 с.</div><div class=\"li\">Депман, И. Я. За страницами учебника математики / И. Я. Депман, Н. Ю. Виленкин. — М. : Просвещение, 1989. — 288 с.</div><div class=\"li\">Джумадильдаев, А. С. Алгебра и логика в школьной математике : методическое руководство / А. С. Джумадильдаев. — Алматы : Гылым, 2020. — 192 с.</div><div class=\"li\">Есмұқанов, М. Е. Математическая грамотность и развитие логического мышления учащихся / М. Е. Есмұқанов. — Астана : Орлеу, 2022. — 180 с.</div><div class=\"li\">Жуманова, Л. К. Развитие функциональной и математической грамотности школьников в условиях обновленного содержания образования / Л. К. Жуманова, А. Б. Сарсенова. — Алматы : Білім, 2023. — 156 с.</div><div class=\"li\">Зихерманн, Г. Геймификация в бизнесе и в жизни: как превратить рутину в игру / Г. Зихерманн, Дж. Линдер. — М. : Манн, Иванов и Фербер, 2014. — 280 с.</div><div class=\"li\">Канель-Белов, А. Я. Как решают нестандартные задачи / А. Я. Канель-Белов, А. К. Ковальджи. — М. : МЦНМО, 2008. — 96 с.</div><div class=\"li\">Кларин, М. В. Инновационные модели обучения: Исследование зарубежного опыта / М. В. Кларин. — М. : Луч, 2016. — 640 с.</div><div class=\"li\">Смирнов, В. А. Геометрия на клетчатой бумаге и наглядно-практические задачи / В. А. Смирнов, И. М. Смирнова. — М. : МЦНМО, 2022. — 144 с.</div><div class=\"li\">Шарыгин, И. Ф. Наглядная геометрия. 5–6 кл. / И. Ф. Шарыгин, Л. Н. Ерганжиева. — М. : Дрофа, 2013. — 192 с.</div></div></div>", "<div class=\"bc-full\"></div>"];
let s = 0, open = false, busy = false;
const L = document.getElementById('pgl'), R = document.getElementById('pgr');
const FLIP = document.getElementById('flip'), FF = document.getElementById('fFront'), FB = document.getElementById('fBack');
const maxS = Math.floor((PAGES.length - 1) / 2);
function paint(){
  L.innerHTML = PAGES[2*s] || '';
  L.dataset.pg = (2*s+1) + ' / ' + PAGES.length;
  R.innerHTML = PAGES[2*s+1] || '';
  R.dataset.pg = (2*s+2) + ' / ' + PAGES.length;
  L.scrollTop = 0; R.scrollTop = 0;
  document.getElementById('pn').textContent = (2*s+1) + '–' + Math.min(2*s+2,PAGES.length) + ' / ' + PAGES.length;
}
function openBook(){
  if(open) return; open = true;
  document.getElementById('cover').classList.add('open');
  setTimeout(()=>{document.getElementById('cover').style.display='none'}, 1200);
}
function flip(dir){
  if(!open || busy) return;
  const ns = s + dir;
  if(ns < 0 || ns > maxS) return;
  busy = true;
  if(dir > 0){
    FF.innerHTML = PAGES[2*s+1] || ''; FF.dataset.pg = (2*s+2) + ' / ' + PAGES.length; FF.scrollTop = 0;
    FB.innerHTML = PAGES[2*ns] || '';    FB.dataset.pg = (2*ns+1) + ' / ' + PAGES.length; FB.scrollTop = 0;
    FLIP.classList.add('go');
    setTimeout(()=>{ s = ns; paint(); FLIP.classList.remove('go'); busy=false; }, 950);
  } else {
    FB.innerHTML = PAGES[2*s] || '';    FB.dataset.pg = (2*s+1) + ' / ' + PAGES.length; FB.scrollTop = 0;
    FF.innerHTML = PAGES[2*ns+1] || ''; FF.dataset.pg = (2*ns+2) + ' / ' + PAGES.length; FF.scrollTop = 0;
    FLIP.style.transition='none'; FLIP.classList.add('go'); void FLIP.offsetWidth;
    FLIP.style.transition='transform .95s cubic-bezier(.55,.1,.3,1)'; FLIP.classList.remove('go');
    setTimeout(()=>{ s = ns; paint(); busy=false; }, 950);
  }
}
document.getElementById('eL').onclick = e => { e.stopPropagation(); flip(-1); };
document.getElementById('eR').onclick = e => { e.stopPropagation(); flip(1); };
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') flip(1);
  if(e.key==='ArrowLeft') flip(-1);
});
let tx=0;
document.addEventListener('touchstart', e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend', e=>{
  const d = e.changedTouches[0].clientX - tx;
  if(Math.abs(d)>60) flip(d<0?1:-1);
},{passive:true});
paint();
</script>
