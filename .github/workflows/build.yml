name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        shell: bash

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > numbra-release.p12
          echo "KEYSTORE_FILE=../numbra-release.p12" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk numbra-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: numbra-release-apk
          path: numbra-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release create numbra-release numbra-release.apk \
            --title "Numbra Release v1.0" \
            --notes "Релизная сборка Numbra — подписанный APK (alias: numbra)." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
